<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="content">
        <h1>TIC-TAC-TOE</h1>
        <div id="names">
            <div id="nameX" class="player">
                <button>Player X</button>
                <div id="markerX"></div>
            </div>
            <div id="nameO" class="player">
                <button>Player O</button>
                <div id="markerO"></div>
            </div>    
        </div>
        <dialog id="changeX">
            <button>&times</button>
            <div>Enter new name for Player X (Limit 15 characters):</div>
            <form id="formX">
                <div class="nameInput">
                    <input type="text" id="playerX" name="playerX" maxlength="15" required autofocus>
                </div>
                <input type="submit" value="Submit">
            </form>
        </dialog>
        <dialog id="changeO">
            <button>&times</button>
            <div>Enter new name for Player O (Limit 15 characters):</div>
            <form id="formO">
                <div class="nameInput">
                    <input type="text" id="playerO" name="playerO" maxlength="15" required autofocus>
                </div>
                <input type="submit" value="Submit">
            </form>
        </dialog>
        <div id="gameboard">
            <div id="0" class="spot"></div>
            <div id="1" class="spot"></div>
            <div id="2" class="spot"></div>
            <div id="3" class="spot"></div>
            <div id="4" class="spot"></div>
            <div id="5" class="spot"></div>
            <div id="6" class="spot"></div>
            <div id="7" class="spot"></div>
            <div id="8" class="spot"></div>
        </div>
        <div id="message"></div>
        <button>Restart Game</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
